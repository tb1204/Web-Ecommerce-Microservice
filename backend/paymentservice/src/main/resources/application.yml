spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/payment
      database: payment
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest
  rabbitmq:
    # Lấy giá trị từ SPRING_RABBITMQ_HOST, nếu không có thì mới dùng localhost
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8084}
server:
  port: 8085

clerk:
  jwks-url: https://pro-oryx-45.clerk.accounts.dev/.well-known/jwks.json
  issuer: https://pro-oryx-45.clerk.accounts.dev

vnpay:
  tmn-code: 7HUUV8OZ
  hash-secret: 6LJS0XD6ME9KCZHHB8IXCLJM5U36ZZ74
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8085/api/payments/vnpay/return

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true # Rất quan trọng trong Docker

