spring:
  application:
    name: voucher-service

  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/artisano
      database: artisano

server:
  port: 8089

clerk:
  jwks-url: https://pro-oryx-45.clerk.accounts.dev/.well-known/jwks.json
  issuer: https://pro-oryx-45.clerk.accounts.dev

#gọi eruka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true # Rất quan trọng trong Docker

