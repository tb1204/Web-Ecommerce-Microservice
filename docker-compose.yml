version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mattress-network

  # ── Discovery Server (Eureka) ────────────────────────────────────
  discoveryserver:
    build: ./backend/discoveryserver
    container_name: discoveryserver
    ports:
      - "8761:8761"
    networks:
      - mattress-network

  # ── API Gateway ──────────────────────────────────────────────────
  apigateway:
    build: ./backend/apigateway
    container_name: apigateway
    ports:
      - "8080:8080"
    depends_on:
      - discoveryserver
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
    networks:
      - mattress-network

  # ── User Service ─────────────────────────────────────────────────
  user-service:
    build: ./backend/userservice
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      - discoveryserver
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/artisano
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
    networks:
      - mattress-network

  # ── Product Service ──────────────────────────────────────────────
  product-service:
    build: ./backend/productservice
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - discoveryserver
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/artisano
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
    networks:
      - mattress-network

  # ── Cart Service ─────────────────────────────────────────────────
  cart-service:
    build: ./backend/cartservice
    container_name: cart-service
    ports:
      - "8083:8083"
    depends_on:
      - discoveryserver
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/artisano
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - CLERK_JWKS_URL=https://pro-oryx-45.clerk.accounts.dev/.well-known/jwks.json
    networks:
      - mattress-network

networks:
  mattress-network:
    driver: bridge
