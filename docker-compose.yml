# test gần đúng 
version: "3.9"

networks:
  artisano-net:
    driver: bridge

volumes:
  mongo_data:

services:
  # ==================== MONGODB (Không dùng user/password) ====================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: artisano        # Tạo sẵn database artisano
    volumes:
      - mongo_data:/data/db
    networks:
      - artisano-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== DISCOVERY SERVER (Eureka) ====================
  discoveryserver:
    build:
      context: ./backend/discoveryserver
      dockerfile: Dockerfile
    container_name: discoveryserver
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - artisano-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== API GATEWAY ====================
  apigateway:
    build:
      context: ./backend/apigateway
      dockerfile: Dockerfile
    container_name: apigateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      discoveryserver:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
    networks:
      - artisano-net

  # ==================== BACKEND SERVICES ====================

  userservice:
    build:
      context: ./backend/userservice
      dockerfile: Dockerfile
    container_name: userservice
    restart: unless-stopped
    ports:
      - "9001:9001"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  productservice:
    build:
      context: ./backend/productservice
      dockerfile: Dockerfile
    container_name: productservice
    restart: unless-stopped
    ports:
      - "9004:9004"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  cartservice:
    build:
      context: ./backend/cartservice
      dockerfile: Dockerfile
    container_name: cartservice
    restart: unless-stopped
    ports:
      - "9005:9005"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  orderservice:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: orderservice
    restart: unless-stopped
    ports:
      - "9003:9003"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  paymentservice:
    build:
      context: ./backend/paymentservice
      dockerfile: Dockerfile
    container_name: paymentservice
    restart: unless-stopped
    ports:
      - "9006:9006"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  notificationservice:
    build:
      context: ./backend/notificationservice
      dockerfile: Dockerfile
    container_name: notificationservice
    restart: unless-stopped
    ports:
      - "9002:9002"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  reviewservice:
    build:
      context: ./backend/review-service
      dockerfile: Dockerfile
    container_name: reviewservice
    restart: unless-stopped
    ports:
      - "9008:9008"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  chatservice:
    build:
      context: ./backend/chatservice
      dockerfile: Dockerfile
    container_name: chatservice
    restart: unless-stopped
    ports:
      - "9007:9007"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  voucherservice:
    build:
      context: ./backend/voucherservice
      dockerfile: Dockerfile
    container_name: voucherservice
    restart: unless-stopped
    ports:
      - "9009:9009"
    depends_on:
      discoveryserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discoveryserver:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/artisano
    networks:
      - artisano-net

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:80"           # Truy cập bằng http://localhost:5173
    depends_on:
      - apigateway
    networks:
      - artisano-net
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://localhost:8080/api