      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/artisano
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Gọi product-service → đổi localhost:8082 → tên container
      PRODUCT_SERVICE_URL: http://product-service:8082
      # Clerk
      CLERK_SECRET_KEY: sk_test_mq9Hrj7XvqbGDNYwgSZvHDDZ5iMk3eOdodECqHEpOU
      CLERK_WEBHOOK_SIGNING_SECRET: "whsec_5SeFqqSkpDMiMWGe+Edi5tD8LezrF8D/"
      CLERK_FRONTEND_API: https://pro-oryx-45.clerk.accounts.dev
      CLERK_JWKS_URL: https://pro-oryx-45.clerk.accounts.dev/.well-known/jwks.json
      CLERK_ISSUER: https://pro-oryx-45.clerk.accounts.dev
      CLERK_API_URL: https://api.clerk.com/v1
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: dkmzqfc8j
      CLOUDINARY_API_KEY: "135129715757794"
      CLOUDINARY_API_SECRET: MA5qNJ0VC-TrlsB9YGQyOU4wgDo
    depends_on:
      eureka-server:
        condition: service_started
    networks:
