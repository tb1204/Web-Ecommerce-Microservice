version: "3.9"

# ═══════════════════════════════════════════════════════════════════
#  ARTISANO — Docker Compose (Production Ready)
#
#  Cấu trúc thư mục thực tế khớp với context bên dưới:
#    backend/apigateway/          → api-gateway    :8080
#    backend/discoveryserver/     → eureka-server  :8761
#    backend/userservice/         → user-service   :8081
#    backend/productservice/      → product-service :8082
#    backend/cartservice/         → cart-service   :8083
#    backend/order-service/       → order-service  :8084
#    backend/paymentservice/      → payment-service :8085
#    backend/chatservice/         → chat-service   :8086
#    backend/notificationservice/ → notification-service :8087
#    backend/review-service/      → review-service :8088
#    backend/voucherservice/      → voucher-service :8089
#    frontend/                    → frontend       :80 (mapped 5173)
#
#  Chạy: docker-compose up --build -d
#  Xem log: docker-compose logs -f <tên-service>
#  Dừng: docker-compose down
#  Reset data: docker-compose down -v
# ═══════════════════════════════════════════════════════════════════

networks:
  artisano-net:
    driver: bridge

volumes:
  rabbitmq_data:

services:
  # ────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE — MongoDB, RabbitMQ, Redis
  # ────────────────────────────────────────────────────────────────

  # mongodb:
  #   image: mongo:7.0
  #   container_name: mongodb
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: root
  #     MONGO_INITDB_ROOT_PASSWORD: root123
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - artisano-net
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "mongosh",
  #         "-u",
  #         "root",
  #         "-p",
  #         "root123",
  #         "--authenticationDatabase",
  #         "admin",
  #         "--eval",
  #         "db.adminCommand('ping')",
  #       ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI: http://localhost:15672  guest/guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - artisano-net
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - artisano-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────
  # DISCOVERY SERVER (Eureka) — :8761
  # context: backend/discoveryserver
  # ────────────────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ./backend/discoveryserver
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
      SPRING_APPLICATION_NAME: eureka-server
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      # Khi chạy Docker, service tự reference qua container name
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - artisano-net
    healthcheck:
      # Eureka không có actuator mặc định nên check port thay vì endpoint
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ────────────────────────────────────────────────────────────────
  # USER SERVICE — :8081
  # context: backend/userservice
  # ────────────────────────────────────────────────────────────────

  user-service:
